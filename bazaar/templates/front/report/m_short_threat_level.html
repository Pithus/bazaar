{% if d.vt %}
  <span class="small text-muted">VT Score</span><br>
  <span class="badge badge-danger small">{{ d.vt.malicious }}/{{ d.vt.total }}</span>
{% endif %}
{% if d.malware_bazaar.vendor_intel.ReversingLabs.threat_name %}
  <span class="small text-muted">Reversing Labs</span><br>
  <span class="badge badge-danger small">{{ d.malware_bazaar.vendor_intel.ReversingLabs.threat_name }}</span>
{% endif %}
{% if d.quark %}
  <span class="small text-muted">Quark</span><br>
  <span class="small badge
              {% if "Low" in d.quark.threat_level %}
              badge-info
              {% elif "Moderate" in d.quark.threat_level %}
              badge-warning text-white
              {% else %}
              badge-danger
              {% endif %}
              ">{{ d.quark.threat_level }}</span>
{% endif %}
